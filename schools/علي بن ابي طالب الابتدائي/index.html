<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>علي بن ابي طالب الابتدائي - معرض الصور</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#294b4b;color:#fff;text-align:center;padding:20px 12px;position:sticky;top:0;z-index:10}
h1{margin:0 0 7px;font-size:25px}
.sub{font-size:14px;opacity:.9}
.gallery{width:96%;max-width:1200px;margin:20px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 9px rgba(0,0,0,.1);cursor:pointer}
.card img{display:block;width:100%;height:235px;object-fit:cover;transition:transform .2s}
.card:hover img{transform:scale(1.02)}
.card span{display:block;text-align:center;padding:8px;font-size:13px;color:#555}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:96vw;max-height:92vh;object-fit:contain}
.close{position:fixed;top:14px;left:18px;background:#fff;color:#111;border:0;border-radius:50%;width:42px;height:42px;font-size:25px;cursor:pointer}
footer{text-align:center;padding:18px;color:#666;font-size:13px}
@media(max-width:800px){.gallery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>علي بن ابي طالب الابتدائي</h1>
<div class="sub">معرض الصور - 8 صور</div>
</header>

<main class="gallery">
<div class="card"><img loading="lazy" src="WhatsApp%20Image%202026-09-20%20at%206.27.09%20PM%20(2).jpeg" alt="صورة 1"><span>صورة 1</span></div>
<div class="card"><img loading="lazy" src="WhatsApp%20Image%202026-09-20%20at%206.27.09%20PM%20(1).jpeg" alt="صورة 2"><span>صورة 2</span></div>
<div class="card"><img loading="lazy" src="WhatsApp%20Image%202026-09-20%20at%206.27.09%20PM.jpeg" alt="صورة 3"><span>صورة 3</span></div>
<div class="card"><img loading="lazy" src="WhatsApp%20Image%202026-09-20%20at%206.27.10%20PM%20(1).jpeg" alt="صورة 4"><span>صورة 4</span></div>
<div class="card"><img loading="lazy" src="WhatsApp%20Image%202026-09-20%20at%206.27.10%20PM%20(2).jpeg" alt="صورة 5"><span>صورة 5</span></div>
<div class="card"><img loading="lazy" src="WhatsApp%20Image%202026-09-20%20at%206.27.10%20PM.jpeg" alt="صورة 6"><span>صورة 6</span></div>
<div class="card"><img loading="lazy" src="WhatsApp%20Image%202026-09-20%20at%206.27.11%20PM%20(1).jpeg" alt="صورة 7"><span>صورة 7</span></div>
<div class="card"><img loading="lazy" src="WhatsApp%20Image%202026-09-20%20at%206.27.11%20PM.jpeg" alt="صورة 8"><span>صورة 8</span></div>
</main>

<div class="lightbox" id="lightbox">
<button class="close" id="close" aria-label="إغلاق">×</button>
<img id="lightboxImg" alt="عرض الصورة">
</div>

<footer>اضغط على أي صورة لعرضها بالحجم الكامل</footer>

<script>
const box=document.getElementById('lightbox');
const big=document.getElementById('lightboxImg');
document.querySelectorAll('.card img').forEach(img=>{
  img.addEventListener('click',()=>{big.src=img.src;box.classList.add('open')});
});
document.getElementById('close').addEventListener('click',()=>box.classList.remove('open'));
box.addEventListener('click',e=>{if(e.target===box)box.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')box.classList.remove('open')});
</script>
</body>
</html>
